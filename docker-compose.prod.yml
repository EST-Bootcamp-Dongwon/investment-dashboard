# 운영 서버 배포용 구성입니다.
#
# 강사님 원본은 edumgt EC2(/opt/investment-analysis)를 전제로 했고 GitHub Actions
# 워크플로가 이 파일을 서버로 복사했습니다. 이 프로젝트는 아직 배포 대상 서버와
# CI/CD 파이프라인을 정하지 않았으므로, 이미지 이름·포트·경로는 v2.0 설계에서
# 다시 정합니다. 지금은 로컬에서 운영 구성을 흉내 낼 때만 사용하세요.
services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/est-bootcamp-dongwon/investment-portfolio-site-backend:latest}
    container_name: portfolio_backend
    restart: unless-stopped
    ports:
      - "8801:8000"
    env_file:
      - app/backend/.env
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    networks:
      - portfolio-net

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: portfolio_qdrant
    restart: unless-stopped
    volumes:
      - portfolio_qdrant_data:/qdrant/storage
    networks:
      - portfolio-net

networks:
  portfolio-net:
    driver: bridge

volumes:
  portfolio_qdrant_data:
