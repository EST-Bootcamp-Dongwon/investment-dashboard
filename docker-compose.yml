name: investment-portfolio-site

# 로컬 PC 실행용 구성입니다.
# 운영 서버는 docker-compose.prod.yml을 사용합니다.
#
# 강사님 원본에 있던 MongoDB(mongo)와 퀴즈 시드(quiz-init)는 퀴즈·단어장 시험
# 기능 전용이었으므로 이 프로젝트에서는 제거했습니다. 남은 상태 저장소는
# 문서 검색(RAG)용 Qdrant 하나뿐입니다.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-investment_docs}
      # RAG_LLM_BASE_URL·RAG_LLM_API_KEY·RAG_LLM_MODEL 3줄을 지웠습니다 (2026-08-16).
      # 기본값이 `https://api.openai.com/v1` 이라, 키만 꽂으면 유료 API 로 나가는
      # 배선이 남아 있었습니다. **절대 제약 1 — LLM 유료 API 비용 0원**의 유일한
      # 실물 위반 지점이었습니다.
      #
      # 파일(`clients/rag_llm.py`)만 지우면 되살아납니다. compose·`.env.example`·
      # 라우터·화면을 같이 걷어야 완료입니다(05 검증본 P0-7).
      # CORS 화이트리스트 (보안과-시크릿 3.3절). **비면 아무 오리진도 허용하지 않습니다.**
      # 이 구성은 프런트와 API 가 같은 컨테이너·같은 포트라 동일 출처이고, 동일 출처면
      # 브라우저가 CORS 를 태우지 않으므로 비워 두어도 화면이 깨지지 않습니다.
      # 프런트를 다른 포트에서 따로 띄울 때만 그 오리진을 적으세요.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # report-only(기본) · enforce · off. 2.3절 1단계가 report-only 입니다.
      CSP_MODE: ${CSP_MODE:-report-only}
      DART_API_KEY: ${DART_API_KEY:-}
      KOSIS_API_KEY: ${KOSIS_API_KEY:-}
      BOK_API_KEY: ${BOK_API_KEY:-}
      # F03 추천 이력 저장·조회. 없으면 preview 만 동작하고 나머지는 503.
      # service_role 키는 서버 전용이다 — 프론트로 내려가면 RLS 가 무력화된다.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - ./docs:/app/docs:ro
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: portfolio_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - portfolio_qdrant_data:/qdrant/storage

  # 문서를 변경한 뒤 `docker compose --profile tools run --rm docs-index`로 실행합니다.
  docs-index:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-investment_docs}
    volumes:
      - ./docs:/app/docs:ro
    depends_on:
      qdrant:
        condition: service_started
    command: ["/app/scripts/upload_docs_to_qdrant.sh"]

volumes:
  portfolio_qdrant_data:
