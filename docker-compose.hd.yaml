name: hyundai-lean

# 현대차 예측 백테스트 실행 구성입니다. 웹앱(docker-compose.yml)과 독립적으로 돕니다.
#
#   docker compose -f docker-compose.hd.yaml run --rm hd-backtest
#
# 전략 코드나 모델을 고쳤다면 --build 를 반드시 붙이세요.
# 코드가 COPY 로 이미지에 구워지기 때문에 안 붙이면 예전 코드가 그대로 돕니다.
#
#   docker compose -f docker-compose.hd.yaml run --build --rm hd-backtest
services:
  hd-backtest:
    build:
      context: ./lean-hyundai
    image: hyundai-lean-module:local
    environment:
      # --- 종목 ---
      HD_TICKER: ${HD_TICKER:-005380.KS}          # Yahoo 티커
      HD_NAME: ${HD_NAME:-현대차}
      HD_LEAN_SYMBOL: ${HD_LEAN_SYMBOL:-005380}   # LEAN 안에서 쓸 심볼 이름

      # --- 구간 ---
      # 워밍업은 학습 시작일에서 역산합니다(TRAIN_START − WARMUP_DAYS). 웹앱 실험실
      # API 도 같은 규칙을 쓰므로 두 경로가 같은 시세를 받아 같은 결과를 냅니다.
      # HD_DATA_START 를 직접 주면 그 값이 우선합니다.
      HD_WARMUP_DAYS: ${HD_WARMUP_DAYS:-120}
      HD_TRAIN_START: ${HD_TRAIN_START:-2025-01-01}
      HD_TRAIN_END: ${HD_TRAIN_END:-2025-12-31}
      HD_TEST_START: ${HD_TEST_START:-2026-01-01}
      HD_TEST_END: ${HD_TEST_END:-2026-06-30}

      # --- 자본과 비용 ---
      # 현대차는 주당 40만원 안팎이라 자본이 작으면 1~2주밖에 못 사서
      # 수익률이 계단식으로 튑니다. 1억원을 기본값으로 둡니다.
      HD_INITIAL_CASH: ${HD_INITIAL_CASH:-100000000}
      HD_COMMISSION_RATE: ${HD_COMMISSION_RATE:-0.00015}  # 위탁수수료 0.015% (편도)
      HD_SELL_TAX_RATE: ${HD_SELL_TAX_RATE:-0.0015}       # 매도세 0.15% (가정, 확인 필요)
      HD_SLIPPAGE_RATE: ${HD_SLIPPAGE_RATE:-0.0005}       # 슬리피지 0.05% (편도)

      HD_SIGNAL_FILE: ${HD_SIGNAL_FILE:-hyundai_signals.csv}
    volumes:
      # 시세 CSV · 신호 CSV · LEAN 결과 · HTML 리포트가 전부 여기로 나옵니다.
      - ./lean-hyundai-results:/results
    restart: "no"
